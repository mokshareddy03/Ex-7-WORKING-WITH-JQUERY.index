<!DOCTYPE html>
<html>
<head>
<title>Photography Budget Planner</title>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

<style>

body{
font-family:Arial;
text-align:center;
background:#f4f6ff;
}

.container{
width:700px;
margin:auto;
padding:20px;
background:white;
box-shadow:0px 0px 10px gray;
margin-top:30px;
}

input{
padding:8px;
margin:10px;
}

button{
padding:10px 20px;
background:#2575fc;
color:white;
border:none;
cursor:pointer;
}

.result{
display:flex;
justify-content:center;
gap:20px;
margin-top:20px;
}

.box{
padding:15px;
color:white;
width:120px;
}

.photo{background:blue;}
.album{background:green;}
.drone{background:red;}
.edit{background:purple;}

</style>

<script>

$(document).ready(function(){

$("#calc").click(function(){

let amount=parseFloat($("#amount").val());

let photo=parseFloat($("#photo").val());
let album=parseFloat($("#album").val());
let drone=parseFloat($("#drone").val());
let edit=parseFloat($("#edit").val());

if(photo+album+drone+edit!=100){
alert("Percentages must equal 100%");
return;
}

$("#p1").html("Rs."+amount*photo/100);
$("#p2").html("Rs."+amount*album/100);
$("#p3").html("Rs."+amount*drone/100);
$("#p4").html("Rs."+amount*edit/100);

});

});

</script>
</head>

<body>

<div class="container">

<h1>📸 Photography Budget Planner</h1>

Amount:
<input type="number" id="amount"><br>

Photography(%):
<input type="number" id="photo" value="40">

Album(%):
<input type="number" id="album" value="20"><br>

Drone(%):
<input type="number" id="drone" value="20">

Editing(%):
<input type="number" id="edit" value="20"><br>

<button id="calc">Calculate Budget</button>

<div class="result">

<div class="box photo">
Photography
<br>
<span id="p1"></span>
</div>

<div class="box album">
Album
<br>
<span id="p2"></span>
</div>

<div class="box drone">
Drone
<br>
<span id="p3"></span>
</div>

<div class="box edit">
Editing
<br>
<span id="p4"></span>
</div>

</div>

</div>

</body>
</html>
